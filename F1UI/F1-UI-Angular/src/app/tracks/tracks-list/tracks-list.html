<h2>Tracks</h2>

<table class="table table-hover table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Country</th>
      <th>Length (km)</th>
      <th style="text-align: center;"><a routerLink="/tracks/new">new</a></th>
    </tr>
  </thead>
  <tbody class="table-primary">
    <tr *ngFor="let track of tracks">
      <td>{{ track.name }}</td>
      <td>{{ track.country }}</td>
      <td>{{ track.length }}</td>
      <td>
        <div class="d-flex gap-2">
        <a [routerLink]="['/tracks/edit', track.id]" class="btn btn-primary btn-sm">Edit</a>
        <button (click)="deleteTrack(track.id!)" class="btn btn-danger btn-sm">Delete</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
