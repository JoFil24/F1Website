<h2>{{ isEdit ? 'Edit' : 'Create' }} Team</h2>

<form (ngSubmit)="save()">
  <div class="d-flex gap-2">
    <input [(ngModel)]="team.name" name="name" placeholder="Name" required />
    <input [(ngModel)]="team.engine" name="engine" placeholder="Engine Manufacturer" required />
    <button class="btn btn-primary btn-sm" type="submit">Save</button>
  </div>
</form>
