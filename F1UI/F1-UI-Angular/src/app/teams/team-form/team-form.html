<div class="container">
  <h2>{{ isEdit ? 'Edit' : 'Create' }} Team</h2>

  <form (ngSubmit)="save()">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" [(ngModel)]="team.name" name="name" placeholder="Name" required />
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label">Engine Manufacturer</label>
        <input class="form-control" [(ngModel)]="team.engine" name="engine" placeholder="Engine manufacturer" required />
      </div>
      <div class="col-12 mt-2">
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </div>
  </form>
</div>
