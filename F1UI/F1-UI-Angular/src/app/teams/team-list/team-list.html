<div class="container">
  <h2>Teams</h2>

  <div class="table-responsive">
    <table class="table table-hover table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Engine Manufacturer</th>
      <th style="text-align: center;"><a routerLink="/teams/new">new</a></th>
    </tr>
  </thead>
  <tbody class="table-primary">
    <tr *ngFor="let team of teams">
      <td>{{ team.name }}</td>
      <td>{{ team.engine }}</td>
      <td>
        <div class="d-flex gap-2">
        <a [routerLink]="['/teams/edit', team.id]" class="btn btn-primary btn-sm">Edit</a>
        <button (click)="deleteTeam(team.id!)" class="btn btn-danger btn-sm">Delete</button>
        </div>
      </td>
    </tr>
  </tbody>
    </table>
  </div>
</div>
