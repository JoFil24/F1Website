<h2>{{ isEdit ? 'Edit' : 'Create' }} Driver Team Pair</h2>

<form (ngSubmit)="save()">
  <div class="d-flex gap-2">
    <input [(ngModel)]="driver.name" name="name" placeholder="Name" required />
    <input [(ngModel)]="driver.country" name="country" placeholder="Country" required />
    <button class="btn btn-primary btn-sm" type="submit">Save</button>
  </div>
</form>
