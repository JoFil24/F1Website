<h2>{{ isEdit ? 'Edit' : 'Create' }} Points Entry</h2>

<form (ngSubmit)="save()">
  <div *ngIf="isEdit">
    <label>Driver</label>
    <input type="text" [value]="driverName === undefined ? 'Loading...' : (driverName ?? 'Unknown driver')" disabled class="form-control" />

    <label>Track</label>
    <input type="text" [value]="trackName === undefined ? 'Loading...' : (trackName ?? 'Unknown track')" disabled class="form-control" />

    <label>Position</label>
    <input type="number" [(ngModel)]="pointsEntry.position" name="position" class="form-control" required />

    <label>Points</label>
    <input type="number" [(ngModel)]="pointsEntry.points" name="points" class="form-control" required />
  </div>

  <div *ngIf="!isEdit">
    <label>Driver</label>
    <ng-container *ngIf="drivers === undefined || drivers.length === 0; else driversReady">
      <select class="form-control" disabled>
        <option>Loading...</option>
      </select>
    </ng-container>
    <ng-template #driversReady>
      <select [(ngModel)]="selectedDriverId" name="driver" class="form-control" required>
        <option [ngValue]="undefined">Choose a driver</option>
        <option *ngFor="let d of drivers" [ngValue]="d.id">{{ d.name }}{{ d.team ? ' (' + d.team + ')' : '' }}</option>
      </select>
    </ng-template>

    <label>Track</label>
    <input type="text" [value]="trackName === undefined ? 'Loading...' : (trackName ?? 'Choose a track')" disabled class="form-control" />

    <label>Position</label>
    <input type="number" [(ngModel)]="pointsEntry.position" name="position" class="form-control" required />

    <label>Points</label>
    <input type="number" [(ngModel)]="pointsEntry.points" name="points" class="form-control" required />
  </div>

  <div style="margin-top:10px">
    <button type="submit" class="btn btn-primary">Save</button>
    <a [routerLink]="['/races', raceId, 'points']" class="btn btn-secondary">Cancel</a>
  </div>
</form>
