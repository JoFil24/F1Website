<h2>Race Results</h2>
<table class="table table-striped table-hover" >
  <thead>
    <tr>
      <th>Position</th>
      <th>Driver</th>
      <th>Points</th>
      <th style="text-align: center;"><a [routerLink]="['/points/new', raceId]">new</a></th>
    </tr>
  </thead>
  <tbody class="table-primary">
    <tr *ngFor="let p of points">
      <td>{{ p.position }}</td>
      <td>{{ p.driverName }}</td>
      <td>{{ p.points }}</td>
      <td>
        <div class="d-flex gap-2">
        <a [routerLink]="['/points/edit', p.driverId, p.raceId]" class="btn btn-primary btn-sm">Edit</a>
        <button (click)="deletePointsEntry(p.driverId)" class="btn btn-danger btn-sm">Delete</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<div *ngIf="!points || points.length === 0">No results for this race.</div>
<div style="margin-top:10px">
  <a routerLink="/races" class="btn btn-secondary">Back to races</a>
</div>

<h3 class="mt-4">Points by Driver</h3>

<div style="height: 400px; max-width: 800px;">
  <canvas
    baseChart
    [data]="chartData"
    [type]="chartType">
  </canvas>
</div>
